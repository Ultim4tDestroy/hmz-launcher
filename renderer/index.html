<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data: https:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'">
  <title>HMZ Launcher</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="design.css">
</head>
<body>
  <div id="ambient" aria-hidden="true"><div class="amb-img" id="ambA"></div><div class="amb-img" id="ambB"></div><div class="amb-veil"></div><div class="amb-grain"></div></div>
  <div id="app">
    <header class="titlebar">
      <div class="tb-left"><div class="brand"><span class="brand-mark"></span>HMZ</div>
        <button class="tb-search" id="searchBtn" title="Rechercher (Ctrl K)"><i data-icon="search"></i><span>Rechercher un jeu…</span><kbd>Ctrl K</kbd></button></div>
      <nav class="topnav" id="side">
        <span class="nav-ind" id="navInd"></span>
        <button data-view="home" class="active" title="Accueil (Ctrl 1)"><i data-icon="home"></i><span>Accueil</span></button>
        <button data-view="library" title="Bibliothèque (Ctrl 2)"><i data-icon="shelf"></i><span>Bibliothèque</span></button>
        <button data-view="emulators" title="Émulateurs (Ctrl 3)"><i data-icon="pad"></i><span>Émulateurs</span></button>
        <button data-view="stats" title="Statistiques (Ctrl 4)"><i data-icon="stats"></i><span>Stats</span></button>
      </nav>
      <div class="tb-right">
        <div class="scan-status" id="scanStatus"></div>
        <button class="tb-icon" id="randomBtn" title="Jeu au hasard (Ctrl R)"><i data-icon="dice"></i></button>
        <button class="tb-icon" data-view="settings" title="Paramètres (Ctrl 5)"><i data-icon="settings"></i></button>
        <button class="tv-btn" id="tvBtn" title="Mode TV (F11)"><i data-icon="tv"></i>Mode TV</button>
        <div class="win-ctrls">
          <button data-win="minimize" title="Réduire"><svg viewBox="0 0 12 12"><path d="M2 6h8"/></svg></button>
          <button data-win="maximize" title="Agrandir"><svg viewBox="0 0 12 12"><rect x="2" y="2" width="8" height="8"/></svg></button>
          <button data-win="close" class="close" title="Fermer"><svg viewBox="0 0 12 12"><path d="m2 2 8 8M10 2l-8 8"/></svg></button>
        </div>
      </div>
    </header>

    <main id="view"></main>
  </div>

  <section id="tv" hidden></section>
  <div id="modal-root"></div>
  <div id="ctx" hidden></div>
  <div id="toasts"></div>

  <script src="core.js"></script>
  <script src="views.js"></script>
  <script src="detail.js"></script>
  <script src="menus.js"></script>
  <script src="actions.js"></script>
  <script src="tv.js"></script>
  <script src="welcome.js"></script>
  <script src="app.js"></script>
</body>
</html>
