# Fabrique le .exe sur un serveur Windows de GitHub et le publie.
# Se lance à chaque tag « v2.x.y » (ou à la main depuis l'onglet Actions).
name: Publier une version

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Créer le tag de version s'il manque
        shell: bash
        run: |
          V="v$(node -p "require('./package.json').version")"
          if ! git ls-remote --exit-code --tags origin "$V" >/dev/null; then
            git tag "$V" && git push origin "$V"
          fi
      - run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
