name: Vérifier HowLongToBeat
on:
  workflow_dispatch:
  schedule:
    - cron: "41 6 * * 1"
jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/verifier-hltb.js
