name: Vérifier le démarrage
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  demarrage:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lancer HMZ et vérifier que la fenêtre s'ouvre
        shell: pwsh
        run: ./scripts/verifier-demarrage.ps1
