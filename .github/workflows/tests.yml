name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Toutes les vérifications (npm run verifier)
        run: npm run verifier
      - name: Electron sait lire la base GOG Galaxy (node:sqlite)
        run: ELECTRON_RUN_AS_NODE=1 npx electron -e "require('node:sqlite'); console.log('node:sqlite OK')"
